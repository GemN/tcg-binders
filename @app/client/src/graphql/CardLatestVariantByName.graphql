query CardLatestVariantByName($cardName: String!) {
  cardsCollection(
    first: 1
    filter: { tcgId: { eq: "mtg" }, name: { eq: $cardName } }
    orderBy: [{ releasedAt: DescNullsLast }, { collectorNumber: AscNullsLast }]
  ) {
    edges {
      node {
        ...CardSearchFields
      }
    }
  }
}
